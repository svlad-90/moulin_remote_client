[mypy]
python_version = 3.10
check_untyped_defs = True
exclude = (^|/)test/
explicit_package_bases = True
files =
    components/config/api/entities.py,
    components/config/api/store.py,
    components/config/src/entities.py,
    components/config/src/store.py,
    components/plugins/api/model.py,
    components/plugins/api/runtime.py,
    components/plugins/src/model.py,
    components/plugins/src/runtime.py,
    components/product_types
follow_imports = skip
ignore_missing_imports = True
no_implicit_optional = True
pretty = True
show_error_codes = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unused_ignores = True
